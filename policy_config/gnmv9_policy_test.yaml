project_name: vint-next-steps
run_name: base-vint-4x4-0c

# training setup
use_wandb: True # set to false if you don't want to log to wandb
train: True
batch_size: 200 # 1000
batch_size_val: 64
epochs: 100
gpu_ids: [5, 6, 7]
num_workers: 12
lr: 5e-4
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosinewarm"
warmup: True # True
warmup_epochs: 100
cyclic_period: 100
plateau_patience: 3
plateau_factor: 0.5
seed: 0


# model params
model_type: gnm_v9_sa
obs_encoder: "efficientnet-b3" # by default, this is imagenet pretrained
goal_encoder: "efficientnet-b3"
goal_embedding_size: null # goal_clip_embd.shape[1]
input_width: 64
input_height: 64
obs_encoding_size: 512
goal_encoding_size: 512
freeze_obs_encoder: False
freeze_goal_encoder: False
goal_type: "image"
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
discrete: True
num_bins: 256
#image_augmentation: ["random_crop", "color_jitter"]


# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 0

# tradeoff between action and distance prediction loss
alpha: 0.5

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 0
  max_dist_cat: 10
close_far_threshold: 10 # distance threshold used to seperate the close and the far  subgoals that are sampled per datapoint

# action output params
len_traj_pred: 5
learn_angle: True

# dataset specific parameters
image_size: [64, 64] # width, height
datasets:
  recon:
    data_folder: /raid/ajaysridhar/gnm_dataset/recon
    train: /raid/ajaysridhar/data_splits/recon/train/ # path to train folder with traj_names.txt
    test: /raid/ajaysridhar/data_splits/recon/test/ # path to test folder with traj_names.txt
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1 # how many goals are sampled per observation
    negative_mining: True # negative mining from the ViNG paper (Shah et al.)
  go_stanford:
    data_folder: /raid/ajaysridhar/gnm_dataset/go_stanford_cropped # datasets/stanford_go_new
    train: /raid/ajaysridhar/data_splits/go_stanford/train/
    test: /raid/ajaysridhar/data_splits/go_stanford/test/
    end_slack: 0
    goals_per_obs: 2 # increase dataset size
    negative_mining: True
  cory_hall:
    data_folder: /raid/ajaysridhar/gnm_dataset/cory_hall/
    train: /raid/ajaysridhar/data_splits/cory_hall/train/
    test: /raid/ajaysridhar/data_splits/cory_hall/test/
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True
  seattle:
    data_folder: /raid/ajaysridhar/gnm_dataset/seattle/
    train: /raid/ajaysridhar/data_splits/seattle/train/
    test: /raid/ajaysridhar/data_splits/seattle/test/
    end_slack: 0
    goals_per_obs: 1
    negative_mining: True
  scand:
    data_folder: /raid/ajaysridhar/gnm_dataset/scand/
    train: /raid/ajaysridhar/data_splits/scand/train/
    test: /raid/ajaysridhar/data_splits/scand/test/
    end_slack: 0
    goals_per_obs: 1
    negative_mining: True
  tartan_drive:
    data_folder: /raid/ajaysridhar/gnm_dataset/tartan_drive/
    train: /raid/ajaysridhar/data_splits/tartan_drive/train/
    test: /raid/ajaysridhar/data_splits/tartan_drive/test/
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True
  sacson:
    data_folder: /nfs/kun2/datasets/gnm_dataset/sacson/
    train: /raid/ajaysridhar/data_splits/sacson/train/
    test: /raid/ajaysridhar/data_splits/sacson/test/
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1
    negative_mining: True

# logging stuff
## =0 turns off
print_log_freq: 100 # in iterations
image_log_freq: 1000 #0 # in iterations
num_images_log: 8 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.25
